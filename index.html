<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">
<title>Treino — Controle Semanal</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230d0f12'/%3E%3Cg fill='%23ff4d2e'%3E%3Crect x='14' y='42' width='10' height='16' rx='3'/%3E%3Crect x='76' y='42' width='10' height='16' rx='3'/%3E%3Crect x='24' y='37' width='9' height='26' rx='3'/%3E%3Crect x='67' y='37' width='9' height='26' rx='3'/%3E%3Crect x='33' y='46' width='34' height='8' rx='4'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230d0f12'/%3E%3Cg fill='%23ff4d2e'%3E%3Crect x='14' y='42' width='10' height='16' rx='3'/%3E%3Crect x='76' y='42' width='10' height='16' rx='3'/%3E%3Crect x='24' y='37' width='9' height='26' rx='3'/%3E%3Crect x='67' y='37' width='9' height='26' rx='3'/%3E%3Crect x='33' y='46' width='34' height='8' rx='4'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  --bg:#0b0d10; --bg2:#13161b; --surface:#181c23; --surface2:#212732;
  --line:#262d38; --line2:#39424f;
  --txt:#f2f5f9; --txt2:#aab4c1; --txt3:#717c8a;
  --accent:#ff4d2e; --accent2:#ff8a3d; --amber:#ffb020;
  --ok:#27d07a; --okdim:#165236; --info:#3da5ff;
  --radius:20px; --radius-sm:14px;
  --shadow:0 10px 34px rgba(0,0,0,.38); --shadow-sm:0 4px 14px rgba(0,0,0,.25);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:radial-gradient(1100px 560px at 100% -10%, rgba(255,77,46,.07), transparent 55%), radial-gradient(1000px 520px at 0% -6%, #1b232e 0%, transparent 60%), var(--bg);
  background-attachment:fixed;color:var(--txt);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;line-height:1.45;padding-bottom:calc(90px + var(--safe-b));}
button{font-family:inherit}
.app{max-width:900px;margin:0 auto;padding:0 18px}
.topbar{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,rgba(13,15,18,.96),rgba(13,15,18,.78) 70%,rgba(13,15,18,0));
  backdrop-filter:blur(10px);padding:calc(14px + var(--safe-t)) 0 12px}
.topbar .app{display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.14em;font-size:18px}
.logo .dot{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;box-shadow:0 6px 18px rgba(255,77,46,.35)}
.logo .dot svg{width:18px;height:18px;fill:#fff}
.logo b{background:linear-gradient(135deg,#fff,#cfd6df);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.spacer{flex:1}
.iconbtn{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--surface);
  color:var(--txt2);display:grid;place-items:center;cursor:pointer;transition:.15s}
.iconbtn:hover{border-color:var(--line2);color:var(--txt)}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.card{background:linear-gradient(180deg,var(--surface),#14181e);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:14px 0;box-shadow:var(--shadow)}
.section-title{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--txt3);font-weight:700;margin:22px 2px 8px}
.muted{color:var(--txt2)} .dim{color:var(--txt3)}
.row{display:flex;align-items:center;gap:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;padding:4px 9px;border-radius:999px;text-transform:uppercase}
.pill.accent{background:rgba(255,77,46,.14);color:#ff7a5e;border:1px solid rgba(255,77,46,.3)}
.pill.ok{background:rgba(39,208,122,.13);color:#4fe39b;border:1px solid rgba(39,208,122,.3)}
.pill.amber{background:rgba(255,176,32,.12);color:var(--amber);border:1px solid rgba(255,176,32,.28)}
.pill.gray{background:var(--surface2);color:var(--txt2);border:1px solid var(--line)}
.btn{appearance:none;border:none;border-radius:13px;padding:13px 16px;font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s;color:#fff}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 20px rgba(255,77,46,.3)}
.btn.primary:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface2);color:var(--txt);border:1px solid var(--line)}
.btn.block{width:100%}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--txt);background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:11px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
label.fld{display:block;margin:10px 0}
label.fld span{display:block;font-size:12px;color:var(--txt2);margin-bottom:5px;letter-spacing:.04em}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:20px;background:linear-gradient(135deg,#22272f,#171b21);border:1px solid var(--line);margin-top:6px}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,77,46,.25),transparent 70%)}
.hero .eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--txt3);font-weight:700}
.hero h1{margin:6px 0 2px;font-size:26px;font-weight:800;line-height:1.1}
.hero .foco{color:var(--txt2);font-size:14px}
.hero .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;position:relative;z-index:1}
.ring-wrap{display:flex;align-items:center;gap:16px;margin-top:16px;position:relative;z-index:1}
.ring{position:relative;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:17px}
.ring-stats{flex:1}
.ring-stats .big{font-size:15px;font-weight:700}
.bar{height:9px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:8px}
.bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}
.grp-head{display:flex;align-items:center;gap:8px;margin:18px 2px 6px}
.grp-head .gline{flex:1;height:1px;background:var(--line)}
.grp-head .gname{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2)}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px;margin:9px 0;transition:.15s}
.ex.done{border-color:rgba(39,208,122,.4);background:linear-gradient(180deg,rgba(39,208,122,.07),var(--surface))}
.ex .top{display:flex;gap:13px;align-items:flex-start}
.chk{width:28px;height:28px;border-radius:9px;border:2px solid var(--line2);flex:none;cursor:pointer;display:grid;place-items:center;margin-top:2px;transition:.15s;background:var(--bg2)}
.chk svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:3;opacity:0;transition:.15s}
.ex.done .chk{background:linear-gradient(135deg,var(--ok),#1fae66);border-color:transparent}
.ex.done .chk svg{opacity:1}
.ex .body{flex:1;min-width:0}
.ex .name{font-weight:700;font-size:15.5px}
.ex.done .name{color:var(--txt2)}
.prbadge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:800;color:#1b1205;background:linear-gradient(135deg,var(--amber),#ffd36b);padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:middle}
.ex .meta{font-size:12.5px;color:var(--txt3);margin-top:3px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ex .meta .s{color:var(--txt2);font-weight:600}
.sets{margin-top:11px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.setshead,.setrow{display:grid;grid-template-columns:46px 1fr 1fr;gap:8px;align-items:center}
.setshead{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt3);font-weight:700;padding:0 2px 4px}
.setshead span{text-align:center}.setshead span:first-child{text-align:left}
.setrow{margin:5px 0}
.setrow .sn{font-size:13px;font-weight:700;color:var(--txt2)}
.setrow input{padding:8px;text-align:center;font-size:14px}
.exacts{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip-sm{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:6px 10px;border-radius:9px;cursor:pointer;
  background:var(--surface2);border:1px solid var(--line);color:var(--txt2);text-decoration:none}
.chip-sm:hover{border-color:var(--line2);color:var(--txt)}
.chip-sm svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.chip-sm.play{color:#ff8a6e;border-color:rgba(255,77,46,.25);background:rgba(255,77,46,.08)}
.chip-sm.rst{color:var(--info);border-color:rgba(61,165,255,.25);background:rgba(61,165,255,.08)}
.ex-edit{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;display:none}
.ex.editing .ex-edit{display:block}
.ex-edit .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.weeknav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 6px}
.weeknav b{font-size:15px}
.daycard{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px;margin:9px 0;cursor:pointer;transition:.15s}
.daycard:hover{border-color:var(--line2)}
.daycard.today{border-color:rgba(255,77,46,.5);box-shadow:0 0 0 1px rgba(255,77,46,.2)}
.daycard .dnum{width:46px;height:46px;border-radius:12px;background:var(--surface2);flex:none;display:grid;place-items:center;text-align:center;line-height:1.1}
.daycard .dnum .wd{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt3);font-weight:700}
.daycard .dnum .dd{font-size:18px;font-weight:800}
.daycard.done .dnum{background:linear-gradient(135deg,var(--okdim),#0f3a26)}
.daycard .info{flex:1;min-width:0}
.daycard .info .t{font-weight:700;font-size:15px}
.daycard .info .f{font-size:12.5px;color:var(--txt3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daycard .rt{text-align:right;flex:none}
.daycard .rt .p{font-weight:800;font-size:15px}
.daycard .rt .l{font-size:11px;color:var(--txt3)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:15px}
.stat .v{font-size:28px;font-weight:800;line-height:1}
.stat .v small{font-size:14px;color:var(--txt3);font-weight:700}
.stat .k{font-size:12px;color:var(--txt2);margin-top:6px;letter-spacing:.03em}
.stat.accent .v{color:var(--accent2)} .stat.ok .v{color:var(--ok)}
canvas{width:100%;display:block}
.wrow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:none}
.wrow .wk{font-weight:800;font-size:17px;width:96px}
.wrow .wd{flex:1;font-size:13px;color:var(--txt3)}
.wrow .wv{font-size:13px;font-weight:700;padding:3px 8px;border-radius:8px}
.wv.up{color:#ff8a6e;background:rgba(255,77,46,.12)} .wv.down{color:#4fe39b;background:rgba(39,208,122,.12)}
.wv.flat{color:var(--txt3);background:var(--surface2)}
.trash{color:var(--txt3);cursor:pointer;padding:4px}
.trash svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}
.prrow{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.prrow:last-child{border:none}
.prrow .pn{flex:1;font-weight:600;font-size:14px}
.prrow .pv{font-weight:800;font-size:15px;color:var(--amber)}
.prrow .pd{font-size:11px;color:var(--txt3)}
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;margin:10px 0}
.note h4{margin:0 0 5px;font-size:14px}
.note p{margin:0;color:var(--txt2);font-size:14px}
.legend{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.legend .tag{flex:none;margin-top:1px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(20,23,28,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 0 calc(8px + var(--safe-b))}
.nav .app{display:flex;justify-content:space-around}
.navbtn{flex:1;min-width:0;background:none;border:none;color:var(--txt3);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 1px;font-size:9.5px;font-weight:700;letter-spacing:.01em;white-space:nowrap;transition:.15s}
.navbtn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2}
.navbtn.active{color:var(--accent2)}
.navbtn.active svg{stroke:var(--accent2)}
@media(min-width:760px){
  body{padding-bottom:54px;padding-top:0}
  .topbar{position:static;padding:20px 0 10px}
  .nav{position:sticky;top:0;bottom:auto;border-top:none;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(11,13,16,.97),rgba(11,13,16,.86));backdrop-filter:blur(16px) saturate(140%);
    padding:8px 0;margin-bottom:22px;box-shadow:0 10px 24px rgba(0,0,0,.30)}
  .nav .app{justify-content:center;gap:4px;border-bottom:none;padding-bottom:0}
  .navbtn{flex:0 0 auto;flex-direction:row;gap:8px;font-size:13.5px;padding:10px 17px;border-radius:12px;border-bottom:none;color:var(--txt2)}
  .navbtn:hover{background:var(--surface);color:var(--txt)}
  .navbtn.active{background:rgba(255,77,46,.13);color:#fff}
  .navbtn.active svg{stroke:var(--accent2)}
  .navbtn svg{width:18px;height:18px}
  #view{padding-top:4px}
  .card{margin:18px 0;padding:20px}
  .stats{grid-template-columns:repeat(4,1fr);gap:14px}
  .hero{padding:26px}
}
.overlay{position:fixed;inset:0;z-index:80;background:rgba(5,6,8,.66);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
@media(min-width:760px){.overlay{align-items:center}}
.sheet{background:var(--bg2);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:520px;padding:18px 18px calc(20px + var(--safe-b));max-height:88vh;overflow:auto;animation:up .25s ease}
@media(min-width:760px){.sheet{border-radius:22px;animation:pop .2s ease}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{margin:2px 0 14px;font-size:19px;display:flex;align-items:center;gap:9px}
.sheet .grab{width:42px;height:5px;border-radius:99px;background:var(--line2);margin:0 auto 14px}
.picklist{max-height:52vh;overflow:auto;margin:4px -4px 0;padding:0 4px}
.pickitem{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:11px;margin:7px 0;cursor:pointer;background:var(--surface)}
.pickitem:hover{border-color:var(--accent)}
.pickitem.cur{border-color:var(--accent);background:rgba(255,77,46,.08)}
.pickitem .pi-n{flex:1;font-weight:600;font-size:14.5px}
.pickitem .pi-g{font-size:11px;color:var(--txt3)}
.pickitem a.pi-v{color:#ff8a6e;padding:4px}
.pickitem a.pi-v svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.timer{text-align:center;padding:10px 0}
.timer .tnum{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,#fff,#9fb0c0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.timer.warn .tnum{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tprog{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:14px 0}
.tprog > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 1s linear}
.tbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:6px}
.chip{padding:8px 14px;border-radius:11px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:14px;color:var(--txt2)}
.chip.on{border-color:var(--accent);color:#fff;background:rgba(255,77,46,.12)}
.fab{position:fixed;right:16px;bottom:calc(98px + var(--safe-b));z-index:45;width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(135deg,var(--info),#2e7fd6);color:#fff;box-shadow:0 10px 26px rgba(61,165,255,.4);display:grid;place-items:center}
.fab svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2}
@media(min-width:760px){.fab{bottom:24px;right:calc(50% - 440px + 16px)}}
.empty{text-align:center;color:var(--txt3);padding:34px 10px;font-size:14px}
.swrow{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);gap:12px}
.swrow:last-child{border:none}
.sw{width:48px;height:28px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);position:relative;cursor:pointer;flex:none;transition:.15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.18s}
.sw.on{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.sw.on::after{left:22px}
.hint{font-size:12px;color:var(--txt3);margin-top:4px}
.ptable{width:100%;border-collapse:collapse;margin-top:10px}
.ptable td{padding:7px 4px;border-bottom:1px solid var(--line);font-size:14px}
.ptable td:last-child{text-align:right;font-weight:700}
.plate-res{text-align:center;font-size:15px;font-weight:700;margin-top:6px;line-height:1.7}
.plate-res .pc{display:inline-block;background:var(--surface2);border:1px solid var(--line2);border-radius:8px;padding:3px 9px;margin:3px}
/* ===== CORPO ===== */
.photogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.photo{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);cursor:pointer;background:var(--surface2);aspect-ratio:3/4}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .pdate{position:absolute;left:0;right:0;bottom:0;font-size:10px;font-weight:700;color:#fff;background:linear-gradient(180deg,transparent,rgba(0,0,0,.72));padding:12px 6px 5px;text-align:center}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.mcell{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.mcell .mk{font-size:12px;color:var(--txt2)}
.mcell .mv{font-size:20px;font-weight:800;margin-top:2px}
.mcell .mv small{font-size:12px;color:var(--txt3);font-weight:700}
.mcell .md{font-size:11px;font-weight:700;margin-top:3px}
.sesschip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.04em;padding:4px 9px;border-radius:999px;background:rgba(61,165,255,.13);color:#7cc0ff;border:1px solid rgba(61,165,255,.3)}

function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function parseYmd(s){const p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);return x;}
function addDays(d,n){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;}
function today(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());}

function seedInitialPrograms(s){
  s.customPrograms=Array.isArray(s.customPrograms)?s.customPrograms:[];
  s.installedProgramSeeds=Array.isArray(s.installedProgramSeeds)?s.installedProgramSeeds:[];
  INITIAL_CUSTOM_PROGRAMS.forEach(p=>{
    if(s.installedProgramSeeds.includes(p.id))return;
    if(!s.customPrograms.some(existing=>existing.id===p.id))s.customPrograms.push(clone(p));
    s.installedProgramSeeds.push(p.id);
  });
  return s;
}

function viewSemana(){

  const base=mondayOf(addDays(today(),weekOffset*7));
  const days=[0,1,2,3,4,5,6].map(i=>addDays(base,i));
  let trained=0,exSum=0,totalPrev=0;
  days.forEach(d=>{const t=planKeyForDate(d),k=ymd(d);totalPrev+=dayTotal(t);const dn=countDone(k,t);exSum+=dn;if(isTrainingDay(t)&&dn>0)trained++;});
  const concl=totalPrev?exSum/totalPrev*100:0;
  const lbl=weekOffset===0?"Esta semana":(weekOffset===-1?"Semana passada":(weekOffset===1?"Próxima semana":`${base.getDate()}/${base.getMonth()+1}`));
  let h=`<div class="weeknav"><button class="iconbtn" id="wPrev"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><b>${lbl} · ${cycleWeekLabel(base)}</b><button class="iconbtn" id="wNext"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button></div>

  </div></div></div>`;
  days.forEach(d=>{const t=planKeyForDate(d),p=PLN(t),k=ymd(d),tot=dayTotal(t),dn=countDone(k,t),pct=tot?Math.round(dn/tot*100):0,isToday=k===ymd(today()),doneFull=isTrainingDay(t)&&dn>0;
    h+=`<div class="daycard ${isToday?'today':''} ${doneFull?'done':''}" data-open="${k}"><div class="dnum"><div class="wd">${WD_SHORT[d.getDay()]}</div><div class="dd">${d.getDate()}</div></div><div class="info"><div class="t">${esc(p.titulo)}${p.variacao?' · var':''}</div><div class="f">${esc(p.foco)}</div></div><div class="rt">${p.rest?`<span class="pill gray">descanso</span>`:`<div class="p" style="color:${pct>=100?'var(--ok)':(pct>0?'var(--accent2)':'var(--txt3)')}">${pct}%</div><div class="l">${dn}/${tot}</div>`}</div></div>`;});
  return h;

function progressByName(){const map={};
  Object.keys(state.sessions).forEach(dk=>{const day=state.sessions[dk];Object.keys(day).forEach(sid=>{const sets=day[sid].sets||[];if(!sets.some(s=>s.kg&&s.reps))return;
    const name=(day[sid].nm||exNameOfSid(sid)),o=map[name]||(map[name]={pts:{},maxKg:0,max1:0,prDate:dk});const e=best1RM(sets),mk=maxKg(sets);
    if(!o.pts[dk]||e>o.pts[dk])o.pts[dk]=e;if(mk>o.maxKg)o.maxKg=mk;if(e>o.max1){o.max1=e;o.prDate=dk;}});});
  return map;}

function viewProgresso(){
  let allTrained=0,allEx=0,allSeries=0;
  Object.keys(state.log).forEach(k=>{const x=historyStats(k);if(x.done>0)allTrained++;allEx+=x.done;allSeries+=x.series;});
  let streak=0,d=today();
  for(let n=0;n<400;n++){const t=planKeyForDate(d),k=ymd(d);if(!isTrainingDay(t)){d=addDays(d,-1);continue;}const dn=historyStats(k).done;
    if(dn>0){streak++;d=addDays(d,-1);}else{if(k===ymd(today())){d=addDays(d,-1);continue;}break;}}
  const map=progressByName(),names=Object.keys(map).sort();
  if(progEx&&names.indexOf(progEx)<0)progEx=null;if(!progEx&&names.length)progEx=names[0];
  let prog="";
  if(names.length){const o=map[progEx];const npts=Object.keys(o.pts).length;
    prog=`<div class="card"><div class="section-title" style="margin-top:0">Progresso por exercício</div>
      <select id="exSelect">${names.map(n=>`<option value="${esc(n)}" ${n===progEx?"selected":""}>${n}</option>`).join("")}</select>
      <div style="height:10px"></div>${npts>=2?'<canvas id="exchart" height="190"></canvas>':'<div class="empty">Registre kg×reps em 2+ dias para ver a curva.</div>'}
      <div class="row" style="gap:16px;margin-top:8px"><div><div style="font-weight:800;font-size:18px;color:var(--amber)">${o.maxKg.toFixed(1)} kg</div><div class="muted" style="font-size:12px">carga máx.</div></div><div><div style="font-weight:800;font-size:18px">${o.max1.toFixed(1)} kg</div><div class="muted" style="font-size:12px">1RM estimado</div></div></div></div>`;}
  else prog=`<div class="card"><div class="section-title" style="margin-top:0">Progresso por exercício</div><div class="empty">Anote o peso e as reps das séries na aba <b>Hoje</b> para acompanhar sua evolução aqui.</div></div>`;
  // PRs
  const prList=names.map(n=>({n,kg:map[n].maxKg,d:map[n].prDate})).filter(x=>x.kg>0).sort((a,b)=>b.kg-a.kg).slice(0,8);
  let prs="";
  if(prList.length){prs=`<div class="card"><div class="section-title" style="margin-top:0">🏆 Recordes (PRs)</div>`+
    prList.map(x=>{const dt=parseYmd(x.d);return `<div class="prrow"><div class="pn">${x.n}</div><div style="text-align:right"><div class="pv">${x.kg.toFixed(1)} kg</div><div class="pd">${dt.getDate()} ${MES[dt.getMonth()]}</div></div></div>`;}).join("")+`</div>`;}
  const weeks=[];for(let w=7;w>=0;w--){const base=mondayOf(addDays(today(),-w*7));let tot=0,dn=0;for(let i=0;i<7;i++){const dd=addDays(base,i),t=planKeyForDate(dd);const hs=historyStats(ymd(dd));tot+=hs.total;dn+=hs.done;}weeks.push({pct:tot?Math.round(dn/tot*100):0});}
  const avg=Math.round(weeks.reduce((a,b)=>a+b.pct,0)/weeks.length);
  return legacyHistorySummary()+`<div class="stats">
    <div class="stat accent"><div class="v">${streak}</div><div class="k">🔥 Sequência (dias)</div></div>
    <div class="stat ok"><div class="v">${allTrained}</div><div class="k">Treinos concluídos</div></div>
    <div class="stat"><div class="v">${allEx}</div><div class="k">Exercícios feitos</div></div>
    <div class="stat"><div class="v">${allSeries}</div><div class="k">Séries totais</div></div></div>
  ${prog}${prs}
  <div class="card"><div class="section-title" style="margin-top:0">Adesão semanal · média ${avg}%</div><canvas id="achart" height="190"></canvas><div class="hint">Últimas 8 semanas · % de exercícios concluídos</div></div>
  <div class="card"><div class="section-title" style="margin-top:0">Resumo do ciclo</div><p class="muted" style="margin:0">Divisão <b>${esc(actProg().nome)}</b>. ${actProg().cycle?"Quartas e sextas alternam C1/C2 e D1/D2 automaticamente.":"Confira os dias e sessões na aba Semana."} Hoje: <b>${cycleWeekLabel(today())}</b>.</p></div>`;
}

  document.querySelectorAll("[data-act]").forEach(el=>{const act=el.dataset.act;
    if(act==="toggle")el.onclick=()=>{const k=ymd(curDate()),tipo=planKeyForDate(curDate()),i=+el.dataset.i,target=!exDone(k,tipo,i);if(PLN(tipo).rest){snapshotDay(k,tipo);dayLog(k,tipo).done[daySlotId(k,tipo,i)]=target;save();render();return;}markExerciseSets(k,tipo,i,target);const completed=updateSessionCompletion(k,tipo);save();if(completed){closeSheet();setTab('run-results');return;}render();if(target&&state.settings.autoRest)openTimer(dayExercise(k,tipo,i).restSeconds);};

      if(runForTipo(tipo)){const name=g("nome").trim(),group=g("grupo").trim(),series=Number(g("series")),reps=g("reps").trim();if(!name||!group||!Number.isInteger(series)||series<1||series>30||!reps){alert("Preencha nome, grupo, séries inteiras de 1 a 30 e repetições.");return;}const entry=EXDB.find(e=>e.nome===name);persistDayChoice(ymd(curDate()),tipo,i,{...(entry||{urlVideo:'',primeiraSubstituicao:'',segundaSubstituicao:''}),nome:name,grupo:group,series,reps,customPrescription:true});return;}

let swapState={tipo:null,i:null,all:false,q:""};
function openSwap(tipo,i){swapState={tipo,i,all:false,q:""};renderSwap();}
function renderSwap(){

function openTools(){
  openSheet(`<h3>🔧 Ferramentas</h3>
    <div class="section-title" style="margin-top:0">Calculadora de 1RM</div>
    <div class="row" style="gap:8px"><input type="number" id="rmKg" placeholder="Peso (kg)" inputmode="decimal"><input type="number" id="rmReps" placeholder="Reps" inputmode="numeric"></div>
    <div id="rmOut" class="muted" style="margin-top:10px;font-size:13px">Informe peso e repetições para estimar seu 1RM (fórmula de Epley) e as cargas por percentual.</div>
    <div class="section-title">Calculadora de anilhas</div>
    <div class="row" style="gap:8px"><input type="number" id="plTotal" placeholder="Peso total (kg)" inputmode="decimal"><input type="number" id="plBar" value="${state.settings.bar}" inputmode="decimal" title="Barra"></div>
    <div class="hint">Discos por lado disponíveis: ${state.settings.plates.join(", ")} kg (edite em Ajustes)</div>
    <div id="plOut" class="plate-res" style="margin-top:8px"></div>
    <div style="height:14px"></div><button class="btn ghost block" onclick="closeSheet()">Fechar</button>`);
  const rmKg=document.getElementById("rmKg"),rmReps=document.getElementById("rmReps"),rmOut=document.getElementById("rmOut");
  function calcRM(){const kg=parseFloat(rmKg.value),r=parseInt(rmReps.value);if(!(kg>0&&r>0)){rmOut.innerHTML="Informe peso e repetições para estimar seu 1RM.";return;}
    const e=kg*(1+r/30);const rows=[100,95,90,85,80,75,70,65,60].map(p=>`<tr><td>${p}%${p===100?' (1RM)':''}</td><td>${roundTo(e*p/100,0.5).toFixed(1)} kg</td></tr>`).join("");
    rmOut.innerHTML=`<div style="font-weight:800;font-size:18px;color:var(--amber);margin-bottom:4px">1RM ≈ ${e.toFixed(1)} kg</div><table class="ptable">${rows}</table>`;}
  rmKg.oninput=calcRM;rmReps.oninput=calcRM;
  const plTotal=document.getElementById("plTotal"),plBar=document.getElementById("plBar"),plOut=document.getElementById("plOut");
  function calcPl(){const total=parseFloat(plTotal.value),bar=parseFloat(plBar.value)||0;if(!(total>0)){plOut.innerHTML="";return;}
    if(total<bar){plOut.innerHTML='<span class="muted">Peso menor que a barra.</span>';return;}
    let per=(total-bar)/2,rem=per;const used=[];const ps=[...state.settings.plates].sort((a,b)=>b-a);
    for(const p of ps)while(rem+1e-9>=p){used.push(p);rem-=p;}
    plOut.innerHTML=`<div class="muted" style="font-size:13px;margin-bottom:4px">${per.toFixed(2).replace(/\.00$/,"")} kg por lado:</div>`+(used.length?used.map(p=>`<span class="pc">${p}</span>`).join("+"):'<span class="muted">só a barra</span>')+(rem>0.01?`<div class="hint" style="margin-top:6px">faltam ${rem.toFixed(2).replace(/\.?0+$/,"")} kg por lado (ajuste o peso ou as anilhas)</div>`:"");}
  plTotal.oninput=calcPl;plBar.oninput=calcPl;
}
function roundTo(v,step){return Math.round(v/step)*step;}

let tInt=null,tLeft=0,tTotal=0,tPaused=false,actx=null;
function openTimer(seconds){if(typeof seconds!=='number'||!Number.isFinite(seconds))seconds=undefined;tTotal=seconds==null?(state.settings.rest||90):Math.max(0,Number(seconds)||0);tLeft=tTotal;tPaused=false;

    <div class="tbtns"><button class="btn ghost" id="tReset">Reiniciar</button><button class="btn primary" id="tToggle">Pausar</button><button class="btn ghost" id="tPlus">+15s</button></div>
    <div style="height:10px"></div><button class="btn ghost block" onclick="closeSheet()">Fechar</button>`);
  document.querySelectorAll("[data-t]").forEach(c=>c.onclick=()=>{tTotal=+c.dataset.t;tLeft=tTotal;state.settings.rest=tTotal;save();document.querySelectorAll("[data-t]").forEach(x=>x.classList.toggle("on",+x.dataset.t===tTotal));updTimer();});
  document.getElementById("tReset").onclick=()=>{tLeft=tTotal;tPaused=false;document.getElementById("tToggle").textContent="Pausar";startTick();updTimer();};
  document.getElementById("tToggle").onclick=()=>{tPaused=!tPaused;document.getElementById("tToggle").textContent=tPaused?"Continuar":"Pausar";if(!tPaused)startTick();};
  document.getElementById("tPlus").onclick=()=>{tLeft+=15;tTotal=Math.max(tTotal,tLeft);updTimer();};
  startTick();updTimer();}
function fmt(s){s=Math.max(0,s);const m=Math.floor(s/60),x=s%60;return (m>0?m+":":"")+String(x).padStart(m>0?2:1,"0");}
function updTimer(){const n=document.getElementById("tNum");if(!n)return;n.textContent=fmt(tLeft);const bar=document.getElementById("tBar");if(bar)bar.style.width=(tTotal?Math.max(0,tLeft/tTotal*100):0)+"%";const box=document.getElementById("timerBox");if(box)box.classList.toggle("warn",tLeft<=5);}
function startTick(){clearInterval(tInt);tInt=setInterval(()=>{if(tPaused)return;tLeft--;updTimer();if(tLeft<=0){clearInterval(tInt);beep();if(navigator.vibrate)navigator.vibrate([200,100,200]);}},1000);}
function stopTimer(){clearInterval(tInt);tInt=null;}
function beep(){if(!state.settings.sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,180,360].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.type="sine";o.frequency.value=880;const t=actx.currentTime+d/1000;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.4,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.start(t);o.stop(t+.18);});}catch(e){}}

/* ===== GRÁFICOS ===== */
function setupCanvas(cv){const dpr=window.devicePixelRatio||1,w=cv.clientWidth||320,h=cv.height;cv.width=w*dpr;cv.height=h*dpr;const c=cv.getContext("2d");c.scale(dpr,dpr);return {c,w,h};}
function lineChart(cv,xs,ys){const {c,w,h}=setupCanvas(cv);const pad={l:38,r:12,t:14,b:24};
  let mn=Math.min.apply(null,ys),mx=Math.max.apply(null,ys);if(mn===mx){mn-=1;mx+=1;}const py=(mx-mn)*0.15;mn-=py;mx+=py;
  const xmin=Math.min.apply(null,xs),xmax=Math.max.apply(null,xs);
  const X=t=>pad.l+(xmax===xmin?0.5:(t-xmin)/(xmax-xmin))*(w-pad.l-pad.r),Y=v=>pad.t+(1-(v-mn)/(mx-mn))*(h-pad.t-pad.b);
  c.strokeStyle="#2a313b";c.fillStyle="#6f7b88";c.font="11px -apple-system,sans-serif";c.lineWidth=1;
  for(let i=0;i<=3;i++){const val=mn+(mx-mn)*i/3,y=Y(val);c.beginPath();c.moveTo(pad.l,y);c.lineTo(w-pad.r,y);c.stroke();c.fillText(val.toFixed(1),4,y+3);}
  const grad=c.createLinearGradient(0,pad.t,0,h-pad.b);grad.addColorStop(0,"rgba(255,77,46,.35)");grad.addColorStop(1,"rgba(255,77,46,0)");
  c.beginPath();c.moveTo(X(xs[0]),Y(ys[0]));for(let i=1;i<xs.length;i++)c.lineTo(X(xs[i]),Y(ys[i]));c.lineTo(X(xs[xs.length-1]),h-pad.b);c.lineTo(X(xs[0]),h-pad.b);c.closePath();c.fillStyle=grad;c.fill();
  c.beginPath();c.moveTo(X(xs[0]),Y(ys[0]));for(let i=1;i<xs.length;i++)c.lineTo(X(xs[i]),Y(ys[i]));c.strokeStyle="#ff6a45";c.lineWidth=2.5;c.lineJoin="round";c.stroke();
  for(let i=0;i<xs.length;i++){c.beginPath();c.arc(X(xs[i]),Y(ys[i]),3.2,0,7);c.fillStyle="#ff8a3d";c.fill();c.strokeStyle="#14171c";c.lineWidth=2;c.stroke();}}
function drawWeightChart(){const cv=document.getElementById("wchart");if(!cv)return;const ws=[...state.weights].sort((a,b)=>a.date<b.date?-1:1);if(ws.length<2)return;lineChart(cv,ws.map(p=>parseYmd(p.date).getTime()),ws.map(p=>p.kg));}
function drawExChart(){const cv=document.getElementById("exchart");if(!cv||!progEx)return;const o=progressByName()[progEx];if(!o)return;const ks=Object.keys(o.pts).sort();if(ks.length<2)return;lineChart(cv,ks.map(k=>parseYmd(k).getTime()),ks.map(k=>o.pts[k]));}
function drawAdherence(){const cv=document.getElementById("achart");if(!cv)return;const {c,w,h}=setupCanvas(cv);const weeks=[];
  for(let wk=7;wk>=0;wk--){const base=mondayOf(addDays(today(),-wk*7));let tot=0,dn=0;for(let i=0;i<7;i++){const dd=addDays(base,i),t=planKeyForDate(dd);const hs=historyStats(ymd(dd));tot+=hs.total;dn+=hs.done;}weeks.push({label:base.getDate()+"/"+(base.getMonth()+1),pct:tot?dn/tot*100:0,cur:wk===0});}
  const pad={l:8,r:8,t:10,b:24},n=weeks.length,gap=10,bw=(w-pad.l-pad.r-gap*(n-1))/n,maxH=h-pad.t-pad.b;c.font="10px -apple-system,sans-serif";
  weeks.forEach((wk,i)=>{const x=pad.l+i*(bw+gap),bh=Math.max(3,maxH*wk.pct/100),y=h-pad.b-bh;c.fillStyle="#21262e";c.beginPath();rr(c,x,pad.t,bw,maxH,6);c.fill();
    const g=c.createLinearGradient(0,y,0,h-pad.b);if(wk.cur){g.addColorStop(0,"#ff8a3d");g.addColorStop(1,"#ff4d2e");}else{g.addColorStop(0,"#4a5563");g.addColorStop(1,"#363f4b");}c.fillStyle=g;c.beginPath();rr(c,x,y,bw,bh,6);c.fill();
    c.fillStyle=wk.cur?"#ffb020":"#6f7b88";c.textAlign="center";c.fillText(wk.label,x+bw/2,h-9);if(wk.pct>0){c.fillStyle="#eef2f6";c.font="bold 10px -apple-system,sans-serif";c.fillText(Math.round(wk.pct)+"%",x+bw/2,y-4);c.font="10px -apple-system,sans-serif";}});}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

/* ===== CORPO: medidas + fotos ===== */
const METRICS=[["cintura","Cintura"],["quadril","Quadril"],["braco","Braço"],["peito","Peito/Tórax"],["coxa","Coxa"],["pant","Panturrilha"]];
let measureMetric=null;
function measuresSection(){const ms=[...(state.measures||[])].sort((a,b)=>a.date<b.date?-1:1);
  const last=ms.length?ms[ms.length-1]:null,prev=ms.length>1?ms[ms.length-2]:null;
  let h=`<div class="section-title">Medidas corporais (cm)</div>`;
  if(!ms.length)h+=`<div class="empty">Nenhuma medida ainda.</div>`;
  else{let cells="";METRICS.forEach(([key,label])=>{const v=last&&last.vals[key]!=null?last.vals[key]:null;if(v==null)return;const pv=prev&&prev.vals[key]!=null?prev.vals[key]:null,dd=pv!=null?(v-pv):null;

/* ===== ATIVIDADES (corrida, esportes, lutas) ===== */
/* [nome, emoji, MET, distMode(0 nenhum, 1 pace, 2 velocidade)]
   Padel: 6 MET, proxy de tênis em duplas. Remo olímpico: 7 MET, aproximação
   operacional para esforço moderado na água. Ambos carecem de validação específica. */
const ACTS=[
 ["Corrida","🏃",9.8,1],["Caminhada","🚶",3.8,1],
 ["Futebol","⚽",7.0,0],["Futsal","🥅",8.0,0],["Futvôlei","🏐",5.5,0],["Vôlei","🏐",4.0,0],
 ["Luta / Jiu-jitsu","🤼",10.0,0],
 ["Pular corda","🪢",11.0,0],["Funcional / HIIT","🔥",8.0,0],["Tênis","🎾",7.3,0],["Padel","🎾",6.0,0],["Remo olímpico","🚣",7.0,2],["Outro","✨",6.0,0]
];
function actMeta(name){return ACTS.find(a=>a[0]===name)||["Outro","✨",6.0,0];}
function actKcal(name,min,intensity){const met=actMeta(name)[2]*(intensity==="leve"?0.85:intensity==="intenso"?1.15:1),w=parseFloat(lastWeight())||75;return Math.round(met*w*(min/60));}
function fmtPace(min,km){if(!(min>0&&km>0))return "";const p=min/km,m=Math.floor(p),s=Math.round((p-m)*60);return (s===60?(m+1)+":00":m+":"+String(s).padStart(2,"0"))+" /km";}
function fmtSpeed(min,km){if(!(min>0&&km>0))return "";return (km/(min/60)).toFixed(1).replace(".",",")+" km/h";}
function actDetail(a){const dm=actMeta(a.type)[3],parts=[];if(a.dur)parts.push(a.dur+" min");
  if(a.dist>0){parts.push((+a.dist).toString().replace(".",",")+" km");if(dm===1)parts.push(fmtPace(a.dur,a.dist));else if(dm===2)parts.push(fmtSpeed(a.dur,a.dist));}
  if(a.intensity&&a.intensity!=="moderado")parts.push(a.intensity);return parts.join(" · ");}

  const acts=[...(state.activities||[])].sort((a,b)=>a.date<b.date?1:(a.date>b.date?-1:0));

  let h=`<div class="stats" style="grid-template-columns:repeat(3,1fr)">

  <div class="row" style="gap:10px;margin:4px 0 0"><button class="btn primary" id="addActivity" style="flex:1"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Registrar atividade</button><button class="btn ghost" id="stretchBtn" title="Alongamento">🧘</button></div>

  return h;
}

function openStretch(){
  openSheet(`<h3>🧘 Alongamento</h3>
    <p class="muted" style="margin:-4px 0 12px;font-size:13.5px">Sequências guiadas que avançam sozinhas, com aviso sonoro na troca.</p>
    <button class="btn primary block" id="rotShort">Rotina curta · ~4 min</button>
    <div style="height:8px"></div><button class="btn primary block" id="rotFull">Rotina completa · ~10 min</button>
    <div class="section-title">Por grupo muscular</div>
    <div class="row" style="gap:7px;flex-wrap:wrap">${[...new Set(STRETCHES.map(s=>s[1]))].map(g=>`<button class="chip" data-sgrp="${esc(g)}">${g}</button>`).join("")}</div>
    <div style="height:12px"></div><button class="btn ghost block" onclick="closeSheet()">Fechar</button>`);
  document.getElementById("rotShort").onclick=()=>startStretch(ROT_CURTA,"Rotina curta");
  document.getElementById("rotFull").onclick=()=>startStretch(ROT_COMPLETA,"Rotina completa");
  document.querySelectorAll("[data-sgrp]").forEach(b=>b.onclick=()=>{const g=b.dataset.sgrp,seq=STRETCHES.map((s,i)=>i).filter(i=>STRETCHES[i][1]===g);startStretch(seq,g);});
}
let stretch={seq:[],idx:0,end:0,int:null,paused:false,left:0,title:""};
function startStretch(seq,title){if(!seq||!seq.length)return;stretch={seq:seq.slice(),idx:0,title,paused:false,int:null,left:0,end:0};stretchStep();}
function stretchStep(){const s=STRETCHES[stretch.seq[stretch.idx]];if(!s){stretchDone();return;}
  stretch.left=s[2];stretch.end=Date.now()+s[2]*1000;stretch.paused=false;renderStretch();
  if(stretch.int)clearInterval(stretch.int);stretch.int=setInterval(stretchTick,200);}
function renderStretch(){const s=STRETCHES[stretch.seq[stretch.idx]];if(!s)return;
  const dots=stretch.seq.map((_,k)=>`<i class="${k<stretch.idx?'cdone':(k===stretch.idx?'on':'')}"></i>`).join("");
  openSheet(`<h3 style="justify-content:space-between">${esc(stretch.title)}<span style="font-size:13px;color:var(--txt3);font-weight:600">${stretch.idx+1}/${stretch.seq.length}</span></h3>
    <div class="stretchview"><div class="sg">${s[1]}</div><div class="sn">${s[0]}</div><div class="sd">${s[3]}</div>
      <div class="bignum" id="sNum">${stretch.left}</div><div class="stepdots">${dots}</div></div>
    <div class="row" style="gap:8px"><button class="btn ghost" id="sPrev" style="flex:1">◀</button><button class="btn ghost" id="sPause" style="flex:1.4">${stretch.paused?"Continuar":"Pausar"}</button><button class="btn primary" id="sNext" style="flex:1">▶</button></div>
    <div style="height:8px"></div><button class="btn ghost block" id="sStop">Encerrar</button>`);
  document.getElementById("sPrev").onclick=()=>{if(stretch.idx>0){stretch.idx--;stretchStep();}};
  document.getElementById("sNext").onclick=()=>{stretch.idx++;if(stretch.idx>=stretch.seq.length)stretchDone();else stretchStep();};
  document.getElementById("sStop").onclick=()=>{stopStretch();closeSheet();};
  document.getElementById("sPause").onclick=function(){stretch.paused=!stretch.paused;if(!stretch.paused)stretch.end=Date.now()+stretch.left*1000;this.textContent=stretch.paused?"Continuar":"Pausar";};
}
function stretchTick(){const el=document.getElementById("sNum");if(!el){stopStretch();return;}if(stretch.paused)return;
  stretch.left=Math.max(0,Math.round((stretch.end-Date.now())/1000));el.textContent=stretch.left;
  if(stretch.left<=0){beep();stretch.idx++;if(stretch.idx>=stretch.seq.length)stretchDone();else stretchStep();}}
function stopStretch(){if(stretch.int){clearInterval(stretch.int);stretch.int=null;}}
function stretchDone(){stopStretch();try{if(navigator.vibrate)navigator.vibrate([120,60,120]);}catch(e){}
  openSheet(`<h3>✅ Alongamento concluído</h3><p class="muted" style="margin:0">Boa! Sessão finalizada — isso ajuda na mobilidade e na recuperação muscular.</p><div style="height:12px"></div><button class="btn primary block" onclick="closeSheet()">Fechar</button>`);}

function attachSync(){if(!fbUser||!fbDb)return;detachSync();const ref=fbDb.collection("treino").doc(fbUser.uid);

function catalogExercise(ex){return EXDB.find(e=>e.nome===ex.nome);}
function dayExercise(k,tipo,i){
  const planned=exAt(tipo,i),choice=(readDayLog(k,tipo)&&readDayLog(k,tipo).exerciseChoices||{})[slotId(tipo,i)];
  return choice?{...planned,...choice,series:choice.customPrescription?choice.series:planned.series,reps:choice.customPrescription?choice.reps:planned.reps,obs:planned.obs}:planned;
}
function daySlotId(k,tipo,i){
  const base=slotId(tipo,i),ex=dayExercise(k,tipo,i);
  return ex.nome===exAt(tipo,i).nome?base:base+'~'+encodeURIComponent(ex.nome);
}
function executionChoices(k,tipo,i){
  const planned=exAt(tipo,i),current=dayExercise(k,tipo,i),entry=catalogExercise(planned);
  const names=[entry&&entry.primeiraSubstituicao,entry&&entry.segundaSubstituicao].filter(Boolean);
  if(!names.length&&current.nome===planned.nome)return '';
  return `<div class="daily-choices"><div class="hint">Substituições para este dia · mantém séries e repetições planejadas</div><div class="row" style="gap:8px;flex-wrap:wrap;margin-top:8px">${[...new Set(names)].map(name=>`<button class="chip-sm" data-day-choice="${esc(name)}" data-i="${i}" ${name===current.nome?'disabled':''}>${esc(name)}${name===current.nome?' ✓':''}</button>`).join('')}${current.nome!==planned.nome?`<button class="chip-sm" data-day-choice="" data-i="${i}">Voltar para ${esc(planned.nome)}</button>`:''}</div></div>`;
}
function selectDayExercise(k,tipo,i,name,allowAny=false){
  const planned=exAt(tipo,i),entry=catalogExercise(planned);
  if(name&&!allowAny&&(!entry||![entry.primeiraSubstituicao,entry.segundaSubstituicao].includes(name)))return;
  const replacement=name&&EXDB.find(e=>e.nome===name);if(name&&!replacement)return;
  persistDayChoice(k,tipo,i,replacement||null);
}

function snapshotDay(k,tipo){const l=dayLog(k,tipo);if(!l.snapshot){l.snapshot=clone(PLN(tipo));l.snapshot.programId=state.programId;l.snapshot.custom=!!customCatalog()[state.programId];l.snapshot.ex=l.snapshot.ex.map((e,i)=>({...dayExercise(k,tipo,i),baseSid:slotId(tipo,i),sid:daySlotId(k,tipo,i)}));}}

function historyStats(k){let total=0,done=0,series=0;for(const l of allDateLogs(k)){const p=l.snapshot;if(!p){done+=Object.values(l.done||{}).filter(Boolean).length;continue;}const ex=p.rest?[]:p.ex;total+=ex.length;for(const e of ex){if(l.done&&l.done[e.sid])done++;const stored=(state.sessions[k]||{})[e.sid];series+=p.runId?(stored&&stored.sets||[]).filter(x=>x.done).length:(l.done&&l.done[e.sid]?parseInt(e.series)||0:0);}}return {total,done,series};}
function customProgramsView(){return `<div class="card"><h3>Meus programas</h3><p class="muted">Monte um ABC ou full-body de três dias. Salve quantos programas quiser e mantenha um ativo por vez.</p><button class="btn primary" id="newCustom">＋ Criar meu treino</button></div>`+(state.customPrograms||[]).map(p=>`<div class="card"><h3>${esc(p.nome)} ${!p.durationWeeks?'<span class="pill amber">Configuração pendente</span>':''} ${activeRun()&&activeRun().programId===p.id&&activeRun().status==='active'?'<span class="pill ok">ativo</span>':''}</h3><p class="muted">${p.model==='abc'?'ABC':'Full-body'} · ${p.sessions.map(t=>WD_SHORT[p.days.indexOf(t)]).join(' / ')}</p>${p.notes?`<p class="muted" style="white-space:pre-wrap">${esc(p.notes)}</p>`:''}<div class="row" style="gap:8px;flex-wrap:wrap">${`<button class="btn primary" data-activate="${p.id}">${activeRun()&&activeRun().programId===p.id?"Configurar outra execução":"Usar este programa"}</button>`}<button class="btn ghost" data-custom-edit="${p.id}">Editar</button><button class="btn ghost" data-custom-copy="${p.id}">Duplicar</button><button class="btn ghost" data-custom-delete="${p.id}">Excluir</button></div></div>`).join('');}
let customDraft=null,customSession=0;
function newCustomProgram(model='abc'){const id=uid(),sessions=[0,1,2].map(()=>uid()),off=uid(),days=Array(7).fill(off),plans={[off]:_off(off)};sessions.forEach((t,i)=>{days[[1,3,5][i]]=t;const groups=model==='abc'?[['Peito','Tríceps','Lateral de Ombro'],['Costas','Bíceps','Posterior de Ombro'],['Quadríceps','Posterior de Coxa','Panturrilha']][i]:['Quadríceps','Peito','Costas','Posterior de Coxa','Abdômen'];plans[t]=_d(t,(model==='abc'?'Treino ':'Full-body ')+['A','B','C'][i],WD_NAMES[[1,3,5][i]],model==='abc'?groups.join(' + '):'Corpo inteiro',groups.map(g=>({...clone(EXDB.find(e=>e.grupo===g)||E(g,'Novo exercício',3,'8–12')),id:uid(),series:3,reps:'8–12'})));});return {id,nome:model==='abc'?'Meu ABC':'Meu full-body',durationWeeks:4,model,sessions,off,days,plans};}
function openCustom(id){const p=(state.customPrograms||[]).find(p=>p.id===id);customDraft=p?clone(p):newCustomProgram();if(p)p.sessions.forEach(t=>customDraft.plans[t].ex=p.plans[t].ex.map((e,i)=>({...exAt(t,i),id:e.id})));customSession=0;renderCustomEditor();}
function captureCustom(){const n=document.getElementById('customName');if(!n)return;customDraft.nome=n.value.trim();customDraft.durationWeeks=Number(document.getElementById('customWeeks').value);const t=customDraft.sessions[customSession];customDraft.plans[t].titulo=document.getElementById('sessionName').value.trim();document.querySelectorAll('[data-custom-ex]').forEach(row=>{const e=customDraft.plans[t].ex.find(e=>e.id===row.dataset.customEx);row.querySelectorAll('[data-field]').forEach(input=>e[input.dataset.field]=input.value.trim());});}
function renderCustomEditor(){const p=customDraft,t=p.sessions[customSession],plan=p.plans[t];openSheet(`<h3>Montar meu treino</h3><p class="hint">Alterações no modelo valem para novas execuções. A execução já iniciada mantém seu planejamento.</p><label class="fld"><span>Duração (1 a 12 semanas)</span><input id="customWeeks" type="number" min="1" max="12" step="1" value="${p.durationWeeks||''}" required></label><label class="fld"><span>Nome do programa</span><input id="customName" maxlength="80" value="${esc(p.nome)}"></label><label class="fld"><span>Modelo inicial (trocar redefine os exercícios)</span><select id="customModel"><option value="abc" ${p.model==='abc'?'selected':''}>ABC — 3 dias</option><option value="fullbody" ${p.model==='fullbody'?'selected':''}>Full-body — 3 dias</option></select></label><p class="hint">Escolha os dias das sessões. Ao escolher um dia ocupado, as duas sessões trocam de dia.</p>${p.sessions.map((sid,i)=>`<label class="fld"><span>Sessão ${['A','B','C'][i]}</span><select data-custom-day="${sid}">${WD_NAMES.map((n,d)=>`<option value="${d}" ${p.days.indexOf(sid)===d?'selected':''}>${n}</option>`).join('')}</select></label>`).join('')}<div class="row" style="gap:8px">${p.sessions.map((sid,i)=>`<button class="btn ${customSession===i?'primary':'ghost'}" data-custom-tab="${i}">${['A','B','C'][i]}</button>`).join('')}</div><label class="fld"><span>Nome da sessão</span><input id="sessionName" maxlength="80" value="${esc(plan.titulo)}"></label>${plan.ex.map((e,i)=>`<div class="card" data-custom-ex="${e.id}"><label class="fld"><span>Exercício ${i+1}</span><input data-field="nome" maxlength="120" value="${esc(e.nome)}"></label><label class="fld"><span>Grupo muscular</span><input data-field="grupo" maxlength="80" value="${esc(e.grupo)}"></label><div class="g2"><label class="fld"><span>Séries</span><input data-field="series" type="number" min="1" max="30" value="${esc(e.series)}"></label><label class="fld"><span>Repetições</span><input data-field="reps" maxlength="60" value="${esc(e.reps)}"></label></div><label class="fld"><span>Observações</span><input data-field="obs" maxlength="300" value="${esc(e.obs)}"></label><div class="row" style="gap:8px"><button class="btn ghost" data-ex-move="${i}" data-dir="-1" ${i===0?'disabled':''}>↑</button><button class="btn ghost" data-ex-move="${i}" data-dir="1" ${i===plan.ex.length-1?'disabled':''}>↓</button><button class="btn ghost" data-ex-remove="${e.id}">Remover</button></div></div>`).join('')}<label class="fld"><span>Adicionar do banco</span><select id="customExercise">${EXDB.map((e,i)=>`<option value="${i}">${esc(e.grupo+' — '+e.nome)}</option>`).join('')}</select></label><button class="btn ghost" id="customAdd">＋ Adicionar exercício</button><div style="height:16px"></div><button class="btn primary block" id="customSave">Salvar programa</button><div style="height:8px"></div><button class="btn ghost block" id="customCancel">Cancelar</button>`);
 document.getElementById('customModel').onchange=e=>{
   const model=e.target.value;
   captureCustom();
   const previous=customDraft,next=newCustomProgram(model);
   next.id=previous.id;
   next.nome=previous.nome;next.durationWeeks=previous.durationWeeks;
   next.sessions.forEach((sid,i)=>{
     const day=previous.days.indexOf(previous.sessions[i]);
     next.days=next.days.map(t=>t===sid?next.off:t);
     next.plans[sid].dia=WD_NAMES[day];
   });
   next.days=previous.days.map(t=>{const i=previous.sessions.indexOf(t);return i<0?next.off:next.sessions[i];});
   customDraft=next;customSession=0;renderCustomEditor();
 };
 document.querySelectorAll('[data-custom-tab]').forEach(b=>b.onclick=()=>{captureCustom();customSession=+b.dataset.customTab;renderCustomEditor();});
 document.querySelectorAll('[data-custom-day]').forEach(el=>el.onchange=()=>{
   const sid=el.dataset.customDay,d=+el.value,old=p.days.indexOf(sid),other=p.days[d];
   p.days[old]=other;p.days[d]=sid;p.plans[sid].dia=WD_NAMES[d];
   if(other!==p.off)p.plans[other].dia=WD_NAMES[old];
   document.querySelectorAll('[data-custom-day]').forEach(select=>select.value=p.days.indexOf(select.dataset.customDay));
 });
 document.querySelectorAll('[data-ex-move]').forEach(b=>b.onclick=()=>{captureCustom();const i=+b.dataset.exMove,j=i+(+b.dataset.dir);[plan.ex[i],plan.ex[j]]=[plan.ex[j],plan.ex[i]];renderCustomEditor();});
 document.querySelectorAll('[data-ex-remove]').forEach(b=>b.onclick=()=>{captureCustom();plan.ex=plan.ex.filter(e=>e.id!==b.dataset.exRemove);renderCustomEditor();});
 document.getElementById('customAdd').onclick=()=>{captureCustom();plan.ex.push({...clone(EXDB[+document.getElementById('customExercise').value]),id:uid(),series:3,reps:'8–12'});renderCustomEditor();};
 document.getElementById('customSave').onclick=saveCustomProgram;document.getElementById('customCancel').onclick=()=>{customDraft=null;closeSheet();};
}
function saveCustomProgram(){captureCustom();const p=customDraft;if(!p.nome||!validWeekCount(p.durationWeeks)||p.sessions.some(t=>!p.plans[t].titulo||!p.plans[t].ex.length||p.plans[t].ex.some(e=>!e.nome||!e.grupo||!Number.isInteger(+e.series)||+e.series<1||+e.series>30||!e.reps))){alert('Informe a duração de 1 a 12 semanas e preencha o nome do programa e das sessões. Cada sessão precisa de exercícios com nome, grupo, 1 a 30 séries inteiras e repetições.');return;}preserveHistory();state.customPrograms=state.customPrograms||[];const i=state.customPrograms.findIndex(x=>x.id===p.id);if(i<0)state.customPrograms.push(clone(p));else state.customPrograms[i]=clone(p);p.sessions.forEach(t=>delete state.overrides[t]);save();customDraft=null;closeSheet();setTab('programas');}
function bindCustomPrograms(){const b=document.getElementById('newCustom');if(b)b.onclick=()=>openCustom();document.querySelectorAll('[data-custom-edit]').forEach(b=>b.onclick=()=>openCustom(b.dataset.customEdit));document.querySelectorAll('[data-custom-copy]').forEach(b=>b.onclick=()=>{const old=(state.customPrograms||[]).find(p=>p.id===b.dataset.customCopy),p=clone(old);p.id=uid();p.nome+=' (cópia)';const map={};[p.off,...p.sessions].forEach(t=>map[t]=uid());p.days=p.days.map(t=>map[t]);p.sessions=p.sessions.map(t=>map[t]);p.off=map[p.off];p.plans=Object.fromEntries(Object.entries(old.plans).map(([t,plan])=>[map[t],{...clone(plan),tipo:map[t],t:map[t],ex:plan.ex.map((e,i)=>({...exAt(t,i),id:uid()}))}]));state.customPrograms.push(p);save();render();});document.querySelectorAll('[data-custom-delete]').forEach(b=>b.onclick=()=>{if(!confirm('Excluir este programa? O histórico registrado será preservado.'))return;preserveHistory();state.customPrograms=state.customPrograms.filter(p=>p.id!==b.dataset.customDelete);if(state.programId===b.dataset.customDelete&&!activeRun())state.programId='refundini';save();render();});}

  const run=activeRun();let proposal;try{proposal=replanProposal(run);}catch(e){alert(e.message);return;}
  if(!proposal){alert('Nenhuma sessão perdida sem registros está disponível para retomar. Sessões parciais não são deslocadas.');return;}
  openSheet(`<h3>Retomar a última sessão perdida</h3><p>A sessão de <b>${esc(proposal.missedDate)}</b> passa para <b>${esc(proposal.targetDate)}</b>.</p><p>O restante não realizado será deslocado em ${proposal.delta} dia(s), incluindo os descansos. Datas já realizadas permanecem iguais.</p><p>Novo término: <b>${esc(proposal.newEnd)}</b>.</p><details><summary>Conferir as ${proposal.changes.length} datas alteradas</summary><table class="cycle-table"><thead><tr><th>Sessão</th><th>Antes</th><th>Depois</th></tr></thead><tbody>${proposal.changes.map(c=>`<tr><td>${esc(run.schedule[c.index].plan.titulo)}</td><td>${esc(c.oldDate)}</td><td>${esc(c.date)}</td></tr>`).join('')}</tbody></table></details><button class="btn primary block" id="applyReplan">Confirmar replanejamento</button><button class="btn ghost block" onclick="closeSheet()">Cancelar</button>`);
  document.getElementById('applyReplan').onclick=()=>{try{applyReplan(run.id,proposal);closeSheet();selectedDate=null;setTab('hoje');}catch(e){alert(e.message);}};
}
function openStartProgram(id,forceNew=false){
  const p=programById(id);if(!p)return;const previous=(state.runs||[]).filter(r=>r.programId===id&&r.status!=='completed').at(-1);
  openSheet(`<h3>${forceNew?'Reiniciar':'Iniciar'} programa</h3><p>${esc(p.nome)}</p><label class="fld"><span>Data de início (segunda-feira)</span><input id="runStart" type="date" value="${ymd(mondayOf(today()))}"></label><label class="fld"><span>Quantidade de semanas (1 a 12)</span><input id="runWeeks" type="number" min="1" max="12" step="1" value="${p.durationWeeks||''}" ${p.periodized?'readonly':''} required></label>${p.periodized?'<p class="hint">Duração definida pelas semanas deste programa padrão.</p>':''}<p class="hint">Uma nova execução mantém os históricos anteriores. A programação avança pelo calendário.</p><button class="btn primary block" id="startRun">Confirmar início</button>${previous&&!forceNew?`<button class="btn ghost block" id="resumeRun">Continuar execução de ${esc(previous.startDate)}</button>`:''}<button class="btn ghost block" onclick="closeSheet()">Cancelar</button>`);
  document.getElementById('startRun').onclick=()=>{try{startProgramRun(id,document.getElementById('runStart').value,Number(document.getElementById('runWeeks').value));closeSheet();selectedDate=null;setTab('hoje');}catch(e){alert(e.message);}};
  const resume=document.getElementById('resumeRun');if(resume)resume.onclick=()=>{const old=activeRun();if(old&&old.id!==previous.id&&old.status==='active')old.status='paused';state.activeRunId=previous.id;state.programId=id;previous.status='active';save();closeSheet();selectedDate=null;setTab('hoje');};
}
function pendingProgramView(){
  if(window.appDataLoadError)return `<div class="card"><h3>Não foi possível carregar os dados</h3><p>${esc(window.appDataLoadError)}</p><p>Os dados originais permanecem no navegador. Exporte uma cópia para recuperação ou importe um backup válido em Ajustes.</p><button class="btn primary" id="recoverOriginal">Salvar dados originais</button></div>`;
  return `<div class="card"><h3>Configuração pendente</h3><p>Defina a data de início e a quantidade de semanas para iniciar ou continuar este programa. Os registros anteriores permanecem como histórico legado.</p><button class="btn primary" data-configure="${esc(state.programId)}">Configurar programa</button><button class="btn ghost" data-go="programas">Selecionar outro</button></div>`;
}
function cycleBanner(){
  const r=activeRun();if(!r)return '';
  const d=runDay(r,ymd(curDate())),week=d?d.sourceWeek:null;
  return `<div class="card"><b>${esc(r.programName)}</b><div class="hint">${week?'Semana '+week+' de '+r.weekCount+' · ':''}${esc(r.startDate)} a ${esc(r.endDate)}</div><div class="cycle-actions"><button class="btn ghost" id="replanRun">Retomar a última sessão perdida</button><button class="btn ghost" data-run-results="${r.id}">Estatísticas do programa</button></div></div>`;
}
function groupHeading(plan,i){const e=plan.ex[i];if(!e.groupId)return '';const members=plan.ex.map((x,j)=>({x,j})).filter(o=>o.x.groupId===e.groupId);if(members[0].j!==i)return '';return `<div class="technique-group"><b>${esc(e.groupType||'Grupo combinado')} · exercícios ${members.map(o=>o.j+1).join(' + ')}</b><div>${members.map(o=>esc(o.x.nome)).join(' → ')}</div><div class="hint">Execute os exercícios deste grupo em sequência, respeitando o descanso de cada prescrição.</div></div>`;}
function isTimedExercise(ex){return /isometria/i.test(ex.technique||'')||/^\s*\d+(?:[–-]\d+)?\s*s\s*$/i.test(ex.reps||'');}
function persistDayChoice(k,tipo,i,choice){
  const planned=exAt(tipo,i);snapshotDay(k,tipo);const l=dayLog(k,tipo),base=slotId(tipo,i);l.exerciseChoices=l.exerciseChoices||{};
  if(choice)l.exerciseChoices[base]=clone(choice);else delete l.exerciseChoices[base];
  const snap=l.snapshot.ex.find(e=>(e.baseSid||e.sid)===base);if(snap)Object.assign(snap,dayExercise(k,tipo,i),{planned:clone(planned),baseSid:base,sid:daySlotId(k,tipo,i)});
  if(countDone(k,tipo)!==dayTotal(tipo))delete l.end;save();render();
}
function markExerciseSets(k,tipo,i,done){
  snapshotDay(k,tipo);const sid=daySlotId(k,tipo,i);state.sessions[k]=state.sessions[k]||{};const old=state.sessions[k][sid]||{sets:[]};const count=seriesCount(tipo,i,k)||3;
  while(old.sets.length<count)old.sets.push({kg:'',reps:''});old.sets.slice(0,count).forEach(s=>s.done=done);const ex=dayExercise(k,tipo,i);old.sets.forEach(set=>set.repsUnit=isTimedExercise(ex)?'seconds':'reps');old.nm=ex.nome;old.gp=ex.grupo;old.runId=runForTipo(tipo)?.id||null;state.sessions[k][sid]=old;dayLog(k,tipo).done[sid]=done;
}
function updateSessionCompletion(k,tipo){
  const l=dayLog(k,tipo),dn=countDone(k,tipo),tot=dayTotal(tipo);
  const owner=runForTipo(tipo);const hasDone=Object.values(state.sessions[k]||{}).some(s=>(!owner||s.runId===owner.id)&&(s.sets||[]).some(x=>x.done));
  if(hasDone&&!l.start)l.start=Date.now();if(!hasDone){delete l.start;delete l.end;}
  if(dn===tot&&tot>0){if(!l.end)l.end=Date.now();}else delete l.end;
  const run=runForTipo(tipo);if(!run)return false;if(run.status==='completed'&&dn<tot){run.status='active';delete run.finishedAt;delete run.finishedOn;}
  const last=run.schedule.filter(d=>!d.plan.rest).sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(last&&last.date===k&&runCompletion(run,last).complete){run.status='completed';run.finishedAt=Date.now();run.finishedOn=k;selectedRunResultId=run.id;return true;}return false;
}
function toggleSetCompletion(k,tipo,i,j,done){
  snapshotDay(k,tipo);const sid=daySlotId(k,tipo,i);state.sessions[k]=state.sessions[k]||{};const r=state.sessions[k][sid]||{sets:[]};while(r.sets.length<=(j))r.sets.push({kg:'',reps:''});r.sets[j].done=done;
  const ex=dayExercise(k,tipo,i);r.sets.forEach(set=>set.repsUnit=isTimedExercise(ex)?'seconds':'reps');r.nm=ex.nome;r.gp=ex.grupo;r.runId=runForTipo(tipo)?.id||null;state.sessions[k][sid]=r;
  const n=seriesCount(tipo,i,k)||3;dayLog(k,tipo).done[sid]=r.sets.slice(0,n).filter(x=>x.done).length===n;
  const completed=updateSessionCompletion(k,tipo);save();if(completed){closeSheet();setTab('run-results');}else{render();if(done&&state.settings.autoRest)openTimer(ex.restSeconds);}
}
function runStatistics(run){
  const sessions=run.schedule.filter(d=>!d.plan.rest),groups={},prs={},actualByName={};let complete=0,partial=0,trained=0,missed=0;
  for(const day of sessions){const c=runCompletion(run,day);if(c.complete)complete++;if(c.partial)partial++;if(c.done>0)trained++;if(day.date<ymd(today())&&!c.hasWork)missed++;
    for(const e of day.plan.ex){const g=groups[e.grupo]||(groups[e.grupo]={planned:0,actual:0});g.planned+=parseInt(e.series)||0;}}
  for(const day of Object.values(state.sessions))for(const s of Object.values(day)){if(s.runId!==run.id)continue;const done=(s.sets||[]).filter(x=>x.done);const g=groups[s.gp]||(groups[s.gp]={planned:0,actual:0});g.actual+=done.length;if(done.length){actualByName[s.nm]=Math.max(actualByName[s.nm]||0,best1RM(done));}}
  for(const [name,value] of Object.entries(actualByName))if(value>(run.baselinePR&&run.baselinePR[name]||0))prs[name]={before:run.baselinePR&&run.baselinePR[name]||0,after:value};
  return {planned:sessions.length,trained,complete,partial,missed,groups,prs};
}
function viewRunResults(id){
  const r=(state.runs||[]).find(x=>x.id===(id||selectedRunResultId))||activeRun();if(!r)return pendingProgramView();const s=runStatistics(r);const duration=Math.round((parseYmd(r.endDate)-parseYmd(r.startDate))/86400000)+1;
  return `<div class="results-back"><button class="btn ghost" id="backRunStats">← Voltar</button></div><div class="hero run-results-hero"><h1>${r.status==='completed'?'Programa concluído':r.status==='elapsed'?'Prazo do programa encerrado':'Estatísticas do programa'}</h1><p>${esc(r.programName)}</p><p>Calendário: ${esc(r.startDate)} a ${esc(r.endDate)}</p>${r.finishedOn?`<p>Última sessão concluída em ${esc(r.finishedOn)}</p>`:''}</div><div class="stats"><div class="stat"><div class="v">${s.trained}/${s.planned}</div><div class="k">Dias treinados / planejados</div></div><div class="stat"><div class="v">${s.complete}</div><div class="k">Sessões completas</div></div><div class="stat"><div class="v">${s.partial}</div><div class="k">Sessões parciais / com registros</div></div><div class="stat"><div class="v">${Math.round(s.trained/s.planned*100)||0}%</div><div class="k">Adesão</div></div></div><div class="card"><p>${s.missed} sessões passadas sem realização. ${s.planned-s.trained} sessões sem séries concluídas no total.</p><p>Duração original: ${r.weekCount} semanas (${r.weekCount*7} dias). Calendário atual: ${duration} dias. Prolongamento: ${duration-r.weekCount*7} dias.</p><h3>Séries por grupo muscular</h3><table class="cycle-table"><thead><tr><th>Grupo principal</th><th>Planejadas</th><th>Realizadas</th></tr></thead><tbody>${Object.entries(s.groups).map(([name,g])=>`<tr><td>${esc(name)}</td><td>${g.planned}</td><td>${g.actual}</td></tr>`).join('')}</tbody></table><p class="hint">Um dia treinado exige ao menos uma série marcada como concluída. Uma série conta apenas quando marcada como concluída. O volume usa o grupo principal do exercício, sem duplicar músculos auxiliares.</p><h3>Exercícios com novo PR: ${Object.keys(s.prs).length}</h3>${Object.entries(s.prs).map(([name,p])=>`<p><b>${esc(name)}</b>: 1RM estimado ${p.before.toFixed(1)} → ${p.after.toFixed(1)} kg${p.before===0?' (primeira referência)':''}</p>`).join('')||'<p>Nenhum novo PR com séries concluídas e carga/repetições numéricas.</p>'}<p class="hint">PR de 1RM estimado pela fórmula de Epley, comparado ao histórico disponível no início desta execução. Dados legados não são atribuídos automaticamente a um ciclo.</p></div><div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn primary" data-restart="${esc(r.programId)}">Reiniciar programa</button><button class="btn ghost" data-go="programas">Selecionar outro programa</button>${r.status!=='completed'&&r.id===state.activeRunId?'<button class="btn ghost" id="replanRun">Retomar a última sessão perdida</button>':''}</div>`;
}
let selectedRunResultId=null;
let runResultsReturnTab='programas';
function legacyDates(){const known=new Set((state.runs||[]).map(r=>r.id));return [...new Set([...Object.keys(state.log),...Object.keys(state.sessions)])].filter(k=>{const root=state.log[k];return !!(root&&(root.snapshot||Object.keys(root.done||{}).length))||Object.values(state.sessions[k]||{}).some(s=>!s.runId||!known.has(s.runId));}).sort().reverse();}
function legacyHistorySummary(){const dates=legacyDates();return dates.length?`<div class="card"><h3>Histórico legado</h3><p>${dates.length} dia(s) de registros anteriores sem vínculo confirmado com uma execução. Esses dados permanecem preservados, sem atribuir datas ou duração a um ciclo.</p><button class="btn ghost" data-go="legacy-history">Consultar registros legados</button></div>`:'';}
function viewLegacyHistory(){
 const known=new Set((state.runs||[]).map(r=>r.id));
 return `<div class="hero"><h1>Histórico legado</h1><p>Consulta dos dados originais. Séries antigas sem confirmação individual não são atribuídas às novas execuções.</p></div>`+legacyDates().map(k=>{
  const root=state.log[k],records=Object.entries(state.sessions[k]||{}).filter(([sid,s])=>!s.runId||!known.has(s.runId));
  return `<details class="card"><summary>${esc(k)} · ${records.length} exercício(s) com séries registradas</summary>${root&&root.done?`<p>Marcações antigas de exercício concluído: ${Object.values(root.done).filter(Boolean).length}.</p>`:''}${records.map(([sid,s])=>`<h3>${esc(s.nm||'Exercício '+sid)}</h3><table class="cycle-table"><thead><tr><th>Série</th><th>kg</th><th>Reps / segundos</th><th>Conclusão</th></tr></thead><tbody>${s.sets.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.kg||'—')}</td><td>${esc(x.reps||'—')}${x.repsUnit==='seconds'?' s':''}</td><td>${x.done===true?'Concluída':x.done===false?'Não marcada':'Não informada'}</td></tr>`).join('')}</tbody></table>`).join('')}</details>`;
 }).join('')+`<button class="btn ghost" data-go="progresso">Voltar ao progresso</button>`;
}
function executionHistoryView(){return (state.runs||[]).length?`<div class="section-title">Execuções e resultados</div>`+state.runs.slice().reverse().map(r=>`<div class="card"><b>${esc(r.programName)}</b><p>${esc(r.startDate)} · ${r.weekCount} semanas · ${esc(({active:'Em andamento',paused:'Pausado',elapsed:'Prazo encerrado',completed:'Concluído'})[r.status])}</p><button class="btn ghost" data-run-results="${r.id}">Ver estatísticas</button></div>`).join(''):'';}
function previewVariationFlip(){
  const r=activeRun();if(!r||r.programId!=='refundini')return;
  const choices={C1:'C2',C2:'C1',D1:'D2',D2:'D1'};
  const eligible=()=>r.schedule.filter(d=>d.date>=ymd(today())&&choices[d.plan.sourceTipo]&&!runCompletion(r,d).hasWork);
  openSheet(`<h3>Inverter variações C/D</h3><p>C1/C2 e D1/D2 serão invertidos em ${eligible().length} sessões de hoje em diante, sem registros. Datas e sessões já realizadas não mudam. Ajustes não executados dessas sessões serão redefinidos.</p><button class="btn primary block" id="confirmFlip">Confirmar inversão</button><button class="btn ghost block" onclick="closeSheet()">Cancelar</button>`);
  document.getElementById('confirmFlip').onclick=()=>{
    if(activeRun()?.id!==r.id)return;
    const changed=eligible();for(const d of changed){const key=choices[d.plan.sourceTipo],old=d.plan;d.plan={...clone(PLANS[key]),tipo:old.tipo,t:old.tipo,runId:r.id,weekNumber:old.weekNumber,sourceTipo:key};delete state.overrides[old.tipo];const root=state.log[d.date];if(root&&root.runLogs)delete root.runLogs[r.id];}
    r.adjustments.push({kind:'variation-flip',at:Date.now(),dates:changed.map(d=>d.date)});save();closeSheet();render();
  };
}
function bindCycles(){
  const back=document.getElementById('backRunStats');if(back)back.onclick=()=>{let target=runResultsReturnTab;const current=activeRun();if(target==='hoje'&&current&&!selectedDate&&(current.status==='completed'||current.status==='elapsed'))target='programas';setTab(target);};
  const cycleButton=document.getElementById('cycleBtn'),r=activeRun();if(cycleButton){cycleButton.style.display=r&&r.programId==='refundini'&&r.status==='active'?'':'none';cycleButton.onclick=previewVariationFlip;}
  document.querySelectorAll('[data-configure]').forEach(b=>b.onclick=()=>openStartProgram(b.dataset.configure));
  document.querySelectorAll('[data-restart]').forEach(b=>b.onclick=()=>openStartProgram(b.dataset.restart,true));
  document.querySelectorAll('[data-run-results]').forEach(b=>b.onclick=()=>{runResultsReturnTab=currentTab==='run-results'?'programas':currentTab;selectedRunResultId=b.dataset.runResults;setTab('run-results');});
  const replan=document.getElementById('replanRun');if(replan)replan.onclick=previewReplan;
  const recover=document.getElementById('recoverOriginal');if(recover)recover.onclick=()=>{const text=localStorage.getItem(LS_KEY)||'{}',a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download='appfit-dados-originais.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);};
  document.querySelectorAll('[data-set-done]').forEach(c=>c.onchange=()=>{const k=ymd(curDate());toggleSetCompletion(k,planKeyForDate(curDate()),+c.dataset.i,+c.dataset.s,c.checked);});
}

for(const data of STANDARD_PROGRAM_DATA){
 const plans={},weekPlans={};
 for(const week of data.weeks){weekPlans[week.number]={};for(let wd=0;wd<7;wd++){const day=week.days.find(d=>d.weekday===wd),key=data.id+'_W'+week.number+'_D'+wd;const plan=day?{tipo:key,t:key,titulo:day.title,dia:WD_NAMES[wd],foco:'Hipertrofia · '+data.nome,ex:clone(day.exercises)}:_off(key);plans[key]=plan;weekPlans[week.number][wd]=plan;}}
 PROGRAMS[data.id]={id:data.id,nome:data.nome,autor:data.autor,emoji:'📅',desc:data.description+' · '+data.level,periodized:true,durationWeeks:data.durationWeeks,plans,weekPlans,cycle:false,keyForDate:d=>weekPlans[1][d.getDay()].tipo};PROG_ORDER.push(data.id);
}
// END CYCLE ENGINE

/* ===== INIT ===== */
document.getElementById("settingsBtn").onclick=openSettings;
document.getElementById("infoBtn").onclick=()=>setTab("notas");
document.getElementById("toolsBtn").onclick=openTools;
document.getElementById("fabTimer").onclick=openTimer;
document.getElementById("cycleBtn").onclick=()=>{const cur=cycleWeekLabel(today());state.anchor=ymd(addDays(parseYmd(state.anchor),7));save();render();
  openSheet(`<h3>↻ Ciclo ajustado</h3><p class="muted">Antes: <b>${cur}</b><br>Agora: <b>${cycleWeekLabel(today())}</b></p><p class="hint">Toque novamente no ↻ do topo se precisar inverter de volta.</p><div style="height:10px"></div><button class="btn primary block" onclick="closeSheet()">Entendi</button>`);};
window.addEventListener("resize",()=>{if(["peso","corpo","progresso"].indexOf(currentTab)>=0)render();});
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
if(getFbCfg())fbInit();
save();
setTab("hoje");
if(!localStorage.getItem("treino_onboarded"))setTimeout(()=>{if(!localStorage.getItem("treino_onboarded")&&!overlay.classList.contains("open"))openOnboard();},500);
</script>
